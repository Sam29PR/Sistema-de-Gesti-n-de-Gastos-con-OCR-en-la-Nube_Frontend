<!-- HTML -->
<div class="sidebar-upload">

  <div class="upload-card">

    <h3 class="title">Subir Factura</h3>

    <p class="subtitle">
      Arrastra tus archivos aquí o haz clic para buscarlos
    </p>

    <!-- ZONA UPLOAD -->
    <div class="upload-zone">

      <div class="upload-icon">
        📄
      </div>

      <label class="upload-btn">

        Seleccionar Archivo

        <input
          type="file"
          (change)="seleccionarArchivo($event)"
        >

      </label>

      <!-- PROGRESS -->
      <div
        class="progress-box"
        *ngIf="subiendo"
      >

        <div class="progress-info">

          <span class="processing">
            🔄 Procesando OCR...
          </span>

          <span class="percent">
            {{ progreso }}%
          </span>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            [style.width.%]="progreso"
          ></div>

        </div>

      </div>

    </div>

    <!-- RECIENTES -->
    <div class="recent-section">

      <h4>Recientes</h4>

      <div
        class="recent-item"
        *ngFor="let item of ultimosArchivos"
      >

        <div class="file-info">

          <div class="file-icon">
            📄
          </div>

          <div>

            <p
              class="file-name"
              [attr.data-fullname]="item.nombre_archivo"
            >
              {{ item.nombre_archivo }}
            </p>

            <p class="file-time">
              {{ item.fecha }}
            </p>

          </div>

        </div>

        <span class="check">
          ✔
        </span>

      </div>

    </div>

  </div>

</div>
